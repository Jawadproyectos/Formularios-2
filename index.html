<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        label{font-family: Arial, Helvetica, sans-serif;
        color: rgb(47, 146, 17);}
    </style>
</head>
<body>
    <h1>Tipos de Input</h1>
    <form action="procesa.php" method="post">
    <fieldset>
        <legend>Datos personales</legend>
       <p>
        <label for="Nombre">Nombre: </label>
    <input id="Nombre" type="text"
    name="nombre"><br>
    </p>
     <p>  
        <label for="Apellidos">Apellidos: 
<input id="Apellidos" type="text"  maxlength="5"
    name="nombre">
    </p></label>
    <p>  
        <label for="Contraseña">Contraseña: 
<input id="contraseña" type="password"  maxlength="8"
    name="Contraseña">
   </label> </p>
    <p> 
        
            
        <label for="Hombre">Hombre</label>
<input type="radio" id="Hombre" name="genero" value="H"  checked>
<label for="Mujer">Mujer</label>
<input type="radio" id="mujer" name="genero" value="M">
  
 </p>
 
 <p>
     <label for="Fumador">Fumador:</label>
    <input type="checkbox" name="fuma" 
    id="Fumador">
 </p>
    </fieldset>
    <p>
         <label for="prov">Provincia:</label>
        <select name="prov" id="prov">
            <option value="cr">Ciudad Real</option>
            <option value="ab">Albacete</option>
            <option value="cu">Cuenca</option>
            <option value="gu">Guadalajara</option>
            <option value="to">Toledo</option>



        </select>
    <p>
        <label for="obs">Observaciones:</label>
        <textarea name="obs"
        cols="10" rows="6"
        id="obs">
        Escriba algo...
        </textarea>

    </p>
    <p>
        <label for="color">Color:</label>
        <input type="color" name="color"
        id="color">
    </p>
      <p>
        <label for="fecha-nac">Fecha de Nacimiento:</label>
        <input type="date" name="fecha-nac"
        id="fecha-nac">
    </p>
    <p>
        <label for="edad">Edad:</label>
        <input type="number" name="edad"
        id="edad" min="0" max="100">
    </p>
    <p>
        <label for="email">Email:</label>
        <input type="email" name="email"
        id="email">
    </p>
    <p>
        <label for="foto">Adjuntar Foto:</label>
        <input type="file" name="foto"
        id="foto">
    </p>

    </p>
    <!-- Botones de envio y reset -->
    <p>

     <input type="submit" value="Enviar">
     <input type="reset" value="Restablecer">
    </p>
</form>
</body>
</html>
